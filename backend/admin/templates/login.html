<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - AI Health Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('admin.static', filename='admin.css') }}?v=99">
</head>
<body>
<div class="bg"><span></span><span></span></div>

<div class="login-card">
  <div class="top">
    <div class="admin-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>Admin Login</h1>
    <p>AI Health Assistant</p>
  </div>

  {% if error %}
  <div class="error-message"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
  {% endif %}

  <div id="loginMessage" class="msg"></div>

  <form id="loginForm" method="POST" action="{{ url_for('admin.login') }}">
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
      </div>
    </div> <!-- FIXED: THIS WAS MISSING -->

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <span class="toggle" id="togglePass"><i class="fa-solid fa-eye"></i></span>
      </div>
    </div>

    <button type="submit" class="login-btn"><i class="fa-solid fa-key"></i> Login</button>
  </form>

  <div class="footer"><i class="fa-solid fa-lock"></i> Authorized admin access only</div>
</div>

<script src="{{ url_for('admin.static', filename='admin.js') }}?v=99"></script>
</body>
</html>
